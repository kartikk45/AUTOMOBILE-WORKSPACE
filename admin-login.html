<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Automobile Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
         :root {
            --primary: #ff2a2a;
            --primary-dark: #e02424;
            --primary-light: #ff5252;
            --dark: #1a1a1a;
            --light: #ffffff;
            --gray: #f5f5f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Animated Background */
        
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        
        .bg-shapes::before,
        .bg-shapes::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite ease-in-out;
        }
        
        .bg-shapes::before {
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }
        
        .bg-shapes::after {
            bottom: -50px;
            right: -50px;
            animation-delay: -7s;
            background: var(--primary-light);
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }
        
        .shape-1 {
            width: 150px;
            height: 150px;
            background: var(--primary);
            top: 20%;
            right: 10%;
            animation-delay: -3s;
        }
        
        .shape-2 {
            width: 100px;
            height: 100px;
            background: var(--primary-light);
            bottom: 30%;
            left: 15%;
            animation-delay: -5s;
        }
        
        .shape-3 {
            width: 80px;
            height: 80px;
            background: var(--primary);
            top: 60%;
            right: 25%;
            animation-delay: -10s;
        }
        
        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -30px) rotate(90deg);
            }
            50% {
                transform: translate(-20px, 20px) rotate(180deg);
            }
            75% {
                transform: translate(20px, 30px) rotate(270deg);
            }
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 40px rgba(255, 42, 42, 0.4);
            animation: pulse 2s infinite ease-in-out;
            position: relative;
        }
        
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 10px 40px rgba(255, 42, 42, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 50px rgba(255, 42, 42, 0.6);
            }
        }
        
        .login-logo::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--primary);
            animation: ripple 2s infinite ease-out;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        .login-logo i {
            font-size: 2.8rem;
            color: var(--light);
        }
        
        .login-container h1 {
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .login-container p {
            color: #666;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 22px;
            text-align: left;
            position: relative;
        }
        
        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--dark);
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .form-group label i {
            color: var(--primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #f8f8f8;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--light);
            box-shadow: 0 5px 20px rgba(255, 42, 42, 0.15);
            transform: translateY(-2px);
        }
        
        .form-group input::placeholder {
            color: #aaa;
        }
        
        .input-icon {
            position: absolute;
            right: 18px;
            top: 42px;
            color: #aaa;
            transition: color 0.3s;
        }
        
        .form-group input:focus~.input-icon {
            color: var(--primary);
        }
        
        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, var(--primary), var(--primary-dark));
            color: var(--light);
            border: none;
            border-radius: 15px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-login:hover::before {
            left: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 42, 42, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-msg {
            color: var(--primary);
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 42, 42, 0.1);
            display: none;
            animation: shake 0.5s ease;
            font-weight: 500;
        }
        
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }
        
        .back-link {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #666;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .back-link:hover {
            color: var(--primary);
            gap: 15px;
        }
        /* Loading spinner */
        
        .loading-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .btn-login.loading .btn-text {
            display: none;
        }
        
        .btn-login.loading .loading-spinner {
            display: block;
        }
        
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 35px 25px;
            }
            .login-logo {
                width: 80px;
                height: 80px;
            }
            .login-logo i {
                font-size: 2rem;
            }
            .login-container h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-user-shield"></i>
        </div>
        <h1>Admin Panel</h1>
        <p>Secure access to manage your business</p>

        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter admin phone number" required>
                <i class="fas fa-phone input-icon"></i>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>

            <button type="submit" class="btn-login">
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</span>
                <div class="loading-spinner"></div>
            </button>

            <p class="error-msg" id="errorMsg">
                <i class="fas fa-exclamation-triangle"></i> Invalid credentials! Redirecting...
            </p>
        </form>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Website
        </a>
    </div>

    <script>
        // Default admin credentials
        const ADMIN_PHONE = '9527460785';
        const ADMIN_PASSWORD = 'auto999';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.querySelector('.btn-login');
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // Add loading effect
            btn.classList.add('loading');

            // Simulate loading delay for better UX
            setTimeout(() => {
                btn.classList.remove('loading');

                if (phone === ADMIN_PHONE && password === ADMIN_PASSWORD) {
                    // Set admin session
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    // Success animation then redirect
                    btn.style.background = 'linear-gradient(45deg, #28a745, #20c997)';
                    btn.innerHTML = '<span class="btn-text"><i class="fas fa-check"></i> Success!</span>';
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 500);
                } else {
                    // Show error message
                    errorMsg.style.display = 'block';

                    // Shake animation
                    const container = document.querySelector('.login-container');
                    container.style.animation = 'shake 0.5s ease';
                    setTimeout(() => {
                        container.style.animation = '';
                    }, 500);

                    // Redirect to index after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            }, 1000);
        });

        // Add shake animation dynamically
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-10px); }
                40% { transform: translateX(10px); }
                60% { transform: translateX(-10px); }
                80% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
